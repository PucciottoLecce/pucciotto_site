<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pucciotto – La puccia 2.0</title>
  <meta name="description" content="Pucciotto – La puccia 2.0. Scopri il menù, gli allergeni, la radio e i giochi.">
  <meta name="theme-color" content="#c0392b">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --cream: #faf8f5; --red: #c0392b; --red2: #a93226; --border: #e8e4e0; }
    html, body { height: 100%; }
    body { background: var(--cream); overflow: hidden; font-family: 'DM Sans', sans-serif; }

    /* Contenuto: le pagine del sito vengono caricate qui dentro */
    .view {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; display: block;
    }

    /* ── Pulsante radio persistente (in alto a destra) ── */
    .radio-btn {
      position: fixed; z-index: 62; top: 11px; right: 14px;
      display: flex; align-items: center; gap: 8px;
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12.5px;
      color: #fff; background: var(--red);
      border: none; border-radius: 40px; cursor: pointer;
      padding: 9px 14px 9px 11px;
      box-shadow: 0 3px 12px rgba(192,57,43,0.32);
      transition: background 0.18s, transform 0.12s;
    }
    .radio-btn:hover { background: var(--red2); }
    .radio-btn:active { transform: scale(0.97); }
    .radio-ico {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0; line-height: 1;
    }
    .radio-label { white-space: nowrap; }
    .radio-eq { display: none; align-items: flex-end; gap: 2px; height: 13px; }
    .radio-btn.playing .radio-eq { display: flex; }
    .radio-eq i { width: 3px; background: #fff; border-radius: 2px; animation: eq 0.8s ease-in-out infinite; }
    .radio-eq i:nth-child(1) { height: 6px;  animation-delay: 0s;   }
    .radio-eq i:nth-child(2) { height: 13px; animation-delay: 0.2s; }
    .radio-eq i:nth-child(3) { height: 9px;  animation-delay: 0.4s; }
    @keyframes eq { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    @media (max-width: 360px) { .radio-label { display: none; } .radio-btn { padding: 9px; } }

    /* ── Pannello radio incorporato ── */
    .radio-panel {
      position: fixed; z-index: 61; top: 62px; right: 16px;
      width: 340px; max-width: calc(100vw - 28px);
      height: 600px; max-height: calc(100vh - 90px);
      background: #111; border-radius: 18px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 50px rgba(0,0,0,0.42);
      display: none; flex-direction: column;
    }
    .radio-panel.open { display: flex; animation: popIn 0.2s ease both; }
    @keyframes popIn { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: none; } }
    .radio-panel-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; background: #1a1a1a; color: #fff;
      font-size: 13px; font-weight: 600; flex-shrink: 0;
    }
    .radio-panel-title { flex: 1; }
    .radio-panel-open, .radio-panel-close {
      width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(255,255,255,0.12); color: #fff; font-size: 13px;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      flex-shrink: 0; transition: background 0.15s;
    }
    .radio-panel-open:hover, .radio-panel-close:hover { background: rgba(255,255,255,0.24); }
    .radio-panel-body { flex: 1; min-height: 0; background: #111; overflow: hidden; position: relative; }
    .radio-panel-body iframe {
      border: 0; display: block;
      width: 143%; height: 143%;
      transform: scale(0.7); transform-origin: top left;
    }
    .radio-panel-msg { color: rgba(255,255,255,0.7); font-size: 12.5px; line-height: 1.6; padding: 18px; text-align: center; }
    .radio-panel-msg a { color: #ff8a7a; }

    @media (max-width: 480px) {
      /* su smartphone: finestra piccola subito sotto il pulsante "Radio Pucciotto" */
      .radio-panel {
        top: 54px; right: 10px; left: auto; bottom: auto;
        width: min(300px, calc(100vw - 20px));
        height: min(500px, calc(100vh - 70px));
        border-radius: 18px;
      }
      /* zoom interno piu' basso: l'intero player entra senza scorrere */
      .radio-panel-body iframe { width: 167%; height: 167%; transform: scale(0.6); }
    }

    /* Sfondo trasparente dietro al pannello: toccando fuori si chiude */
    .radio-backdrop { position: fixed; inset: 0; z-index: 59; display: none; background: transparent; }
    .radio-backdrop.show { display: block; }

    /* Suggerimento iniziale vicino al pulsante radio */
    .radio-hint {
      position: fixed; z-index: 63; top: 54px; right: 14px;
      max-width: 230px; background: #1a1a1a; color: #fff;
      font-size: 12.5px; line-height: 1.4; font-weight: 500;
      padding: 10px 12px; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: flex; gap: 8px; align-items: flex-start;
      animation: hintIn 0.35s ease both; cursor: pointer;
    }
    .radio-hint::before {
      content: ""; position: absolute; top: -6px; right: 30px;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 6px solid #1a1a1a;
    }
    .radio-hint.hide { display: none; }
    .radio-hint-x {
      background: none; border: none; color: rgba(255,255,255,0.6);
      font-size: 16px; line-height: 1; cursor: pointer; padding: 0; flex-shrink: 0;
    }
    @keyframes hintIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <!-- Le pagine del sito vengono caricate qui; la radio sotto resta sempre attiva -->
  <iframe id="view" class="view" src="home.html" title="Pucciotto" allow="autoplay; encrypted-media"></iframe>

  <!-- Sfondo per chiudere il pannello toccando fuori -->
  <div class="radio-backdrop" id="radio-backdrop"></div>

  <!-- Suggerimento iniziale -->
  <div class="radio-hint hide" id="radio-hint" role="status">
    <span>🎧 Avvia la radio mentre sfogli il menù!</span>
    <button class="radio-hint-x" id="radio-hint-x" aria-label="Chiudi suggerimento">×</button>
  </div>

  <!-- Radio persistente -->
  <button class="radio-btn" id="radio-btn" aria-label="Ascolta Radio Pucciotto">
    <span class="radio-ico" id="radio-ico">▶</span>
    <span class="radio-label">Radio Pucciotto</span>
    <span class="radio-eq"><i></i><i></i><i></i></span>
  </button>

  <div class="radio-panel" id="radio-panel" aria-hidden="true">
    <div class="radio-panel-head">
      <span class="radio-panel-title">📻 Radio Pucciotto</span>
      <a class="radio-panel-open" href="https://radio.pucciotto.it/" target="_blank" rel="noopener" title="Apri a schermo intero">↗</a>
      <button class="radio-panel-close" id="radio-panel-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="radio-panel-body" id="radio-panel-body"></div>
  </div>

  <script>
    // ── Radio Pucciotto: vive nel contenitore, non si ferma mai al cambio pagina ──
    const RADIO_SITE = "https://radio.pucciotto.it/";
    (function initRadio() {
      const btn   = document.getElementById("radio-btn");
      const ico   = document.getElementById("radio-ico");
      const panel = document.getElementById("radio-panel");
      const body  = document.getElementById("radio-panel-body");
      const close = document.getElementById("radio-panel-close");
      const backdrop = document.getElementById("radio-backdrop");
      const hint  = document.getElementById("radio-hint");
      const hintX = document.getElementById("radio-hint-x");

      function hideHint() { hint.classList.add("hide"); }

      function openRadio() {
        hideHint();
        backdrop.classList.add("show");
        if (!body.querySelector("iframe")) {
          const f = document.createElement("iframe");
          f.src = RADIO_SITE;
          f.title = "Radio Pucciotto";
          f.allow = "autoplay; encrypted-media; fullscreen";
          f.loading = "eager";
          f.addEventListener("error", showBlocked);
          body.appendChild(f);
        }
        panel.classList.add("open");
        panel.setAttribute("aria-hidden", "false");
        btn.classList.add("playing"); // segnala che la radio e' accesa
        ico.textContent = "⏸";
      }

      function closeRadio() {
        // nasconde soltanto il pannello: l'iframe resta in vita e la radio
        // continua a suonare in sottofondo
        panel.classList.remove("open");
        panel.setAttribute("aria-hidden", "true");
        backdrop.classList.remove("show");
      }

      function showBlocked() {
        body.innerHTML =
          '<div class="radio-panel-msg">Impossibile mostrare la radio qui dentro.<br>' +
          '<a href="' + RADIO_SITE + '" target="_blank" rel="noopener">Apri Radio Pucciotto ↗</a></div>';
      }

      btn.addEventListener("click", () => {
        panel.classList.contains("open") ? closeRadio() : openRadio();
      });
      close.addEventListener("click", closeRadio);
      // tocco/clic fuori dal pannello → si chiude (la radio continua a suonare)
      backdrop.addEventListener("click", closeRadio);

      // Suggerimento all'avvio: una volta per sessione, sparisce da solo
      let seen = false;
      try { seen = sessionStorage.getItem("radioHintSeen") === "1"; } catch (_) {}
      if (!seen) {
        setTimeout(() => hint.classList.remove("hide"), 1200);
        setTimeout(hideHint, 9000);
        try { sessionStorage.setItem("radioHintSeen", "1"); } catch (_) {}
      }
      hintX.addEventListener("click", e => { e.stopPropagation(); hideHint(); });
      hint.addEventListener("click", openRadio); // toccando il suggerimento parte la radio
    })();
  </script>
</body>
</html>
