<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Menù – Pucciotto</title>
  <meta name="description" content="Menù completo di Pucciotto – pucciotti, crocchette e bevande.">
  <meta name="theme-color" content="#c0392b">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #faf8f5; --white: #fff; --black: #1a1a1a;
      --red: #c0392b; --red2: #a93226;
      --border: #e8e4e0; --muted: #999;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--black); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,248,245,0.96); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px; height: 54px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; text-decoration: none; }
    .header-brand img { width: 140px; height: auto; display: block; }
    .back-btn {
      text-decoration: none; color: var(--muted);
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 4px;
      padding: 7px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--white);
      transition: all 0.18s;
    }
    .back-btn:hover { color: var(--black); border-color: #bbb; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
      position: sticky; top: 54px; z-index: 99;
      background: rgba(250,248,245,0.96); backdrop-filter: blur(14px);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      background: var(--white); border: 1.5px solid var(--border); border-radius: 50px;
      color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; padding: 7px 16px;
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .tab-btn.active { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 3px 10px rgba(192,57,43,0.22); }
    .tab-btn:hover:not(.active) { border-color: #bbb; color: var(--black); }

    /* ── Content ── */
    .content { max-width: 680px; margin: 0 auto; padding: 20px 16px 110px; }
    .category-section { display: none; animation: fadeUp 0.22s ease both; }
    .category-section.active { display: block; }

    .cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .cat-icon { font-size: 22px; }
    .cat-title { font-family: 'Lobster', cursive; font-size: 26px; color: var(--black); }
    .cat-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .cat-count { background: #f0ece8; color: var(--muted); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .cat-subtitle { font-size: 13px; color: var(--muted); }

    /* ── Cards ── */
    .menu-grid { display: flex; flex-direction: column; gap: 10px; }
    .menu-card {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 16px 18px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.12s;
      cursor: pointer;
    }
    .menu-card:hover { border-color: #d0ccc8; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .menu-card:active { transform: scale(0.99); border-color: #d0ccc8; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .menu-card.unavailable { opacity: 0.42; }

    .card-thumb {
      width: 68px; height: 68px; flex-shrink: 0; align-self: center;
      border-radius: 12px; object-fit: cover;
      background: #f0ece8; border: 1px solid var(--border);
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .card-ingredients { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
    .card-allergens { display: flex; flex-wrap: wrap; gap: 5px; }
    .allergen-tag {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      background: #fff3f2; color: var(--red); border: 1px solid rgba(192,57,43,0.18);
      padding: 3px 8px; border-radius: 8px;
    }

    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .card-price { font-family: 'Lobster', cursive; font-size: 22px; color: var(--red); }
    .unavailable-badge {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      background: #f5f3f0; color: var(--muted); padding: 4px 10px; border-radius: 20px;
    }

    /* ── Loading ── */
    .state-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; gap: 12px; }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.65s linear infinite; }
    .state-msg { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; }

    /* ── Float nav ── */
    .float-nav {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%;
      transform: translateX(-50%) translateY(70px);
      z-index: 200;
      display: flex; gap: 4px;
      background: rgba(22,22,22,0.94); border-radius: 50px;
      padding: 5px; box-shadow: 0 8px 30px rgba(0,0,0,0.28);
      backdrop-filter: blur(18px);
      transition: transform 0.32s cubic-bezier(.22,1,.36,1), opacity 0.32s ease;
      opacity: 0; pointer-events: none;
    }
    .float-nav.visible { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .float-btn {
      background: none; border: none; color: rgba(255,255,255,0.48);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      padding: 9px 16px; cursor: pointer; border-radius: 50px;
      transition: all 0.18s; white-space: nowrap;
      display: flex; align-items: center; gap: 5px;
    }
    .float-btn.active { background: var(--red); color: #fff; }
    .float-btn:hover:not(.active) { color: #fff; }

    /* ── Scheda dettaglio (modal) ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      background: var(--white); width: 100%; max-width: 440px;
      border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto;
      transform: translateY(100%); transition: transform 0.32s cubic-bezier(.22,1,.36,1);
      position: relative;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    @media (min-width: 700px) {
      .modal-overlay { align-items: center; padding: 24px; }
      .modal-sheet { border-radius: 22px; transform: translateY(24px) scale(0.98); }
      .modal-overlay.open .modal-sheet { transform: translateY(0) scale(1); }
    }
    .modal-close {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.92); color: var(--black);
      font-size: 15px; cursor: pointer; backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-img-wrap { width: 100%; }
    .modal-img-wrap img { width: 100%; height: 190px; object-fit: cover; display: block; border-radius: 22px 22px 0 0; }
    .modal-body { padding: 20px; }
    .modal-body.no-img { padding-top: 34px; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .modal-name { font-family: 'Lobster', cursive; font-size: 26px; font-weight: 400; line-height: 1.15; }
    .modal-price { font-family: 'Lobster', cursive; font-size: 26px; color: var(--red); flex-shrink: 0; }
    .modal-cat {
      display: inline-block; margin-top: 10px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      background: #fff3f2; color: var(--red); padding: 4px 12px; border-radius: 20px;
    }
    .modal-unavail {
      display: inline-block; margin-top: 10px; margin-left: 6px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      background: #f5f3f0; color: var(--muted); padding: 4px 12px; border-radius: 20px;
    }
    .modal-section { margin-top: 18px; }
    .modal-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .modal-text { font-size: 14px; line-height: 1.65; color: #333; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<header class="header">
  <a href="index.html" class="header-brand"><img src="logo_text.svg" alt="Pucciotto"></a>
  <a href="index.html" class="back-btn">← Indietro</a>
</header>

<div class="tabs" id="tabs"></div>

<main class="content">
  <div class="state-wrap" id="loading">
    <div class="spinner"></div>
    <p class="state-msg">Caricamento menù…</p>
  </div>
  <div id="menu-content" style="display:none"></div>
</main>

<nav class="float-nav" id="float-nav"></nav>

<div class="modal-overlay" id="detail-modal"><div class="modal-sheet"></div></div>

<script>
const API_BASE = "https://orderpucciotto.onrender.com";
const CAT_META = {
  pucciotti:  { label: "Pucciotti",  icon: "🥙", sub: "La nostra puccia" },
  crocchette: { label: "Crocchette", icon: "🥔", sub: "Artigianali" },
  bevande:    { label: "Bevande",    icon: "🥤", sub: "Bibite e birre" },
};

// Ricava l'URL immagine di un prodotto dal DB, provando i nomi di campo più comuni.
// Gestisce URL assoluti e percorsi relativi (prefissati con l'API).
function itemImage(item) {
  const raw = item.image_url || item.image || item.img || item.photo
    || item.image_path || item.thumbnail
    || (Array.isArray(item.images) && item.images[0]) || "";
  if (!raw) return "";
  if (/^https?:\/\//i.test(raw)) return raw;
  return API_BASE + (String(raw).startsWith("/") ? "" : "/") + raw;
}

async function loadMenu() {
  try {
    const res = await fetch(`${API_BASE}/api/menu`);
    if (!res.ok) throw new Error();
    renderMenu(await res.json());
  } catch (e) {
    document.getElementById("loading").innerHTML =
      `<p class="state-msg">⚠️ Impossibile caricare il menù.<br>Riprova tra qualche istante.</p>`;
  }
}

function renderMenu(data) {
  document.getElementById("loading").style.display = "none";
  const wrap = document.getElementById("menu-content");
  const tabsEl = document.getElementById("tabs");
  const floatEl = document.getElementById("float-nav");
  wrap.style.display = "block";

  const cats = Object.keys(CAT_META).filter(c => data[c] && data[c].length);

  cats.forEach((cat, i) => {
    const m = CAT_META[cat];
    const items = data[cat];
    const avail = items.filter(x => x.is_available).length;

    // top tab
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.innerHTML = `${m.icon} ${m.label}`;
    btn.dataset.cat = cat;
    btn.addEventListener("click", () => switchTab(cat));
    tabsEl.appendChild(btn);

    // float btn
    const fb = document.createElement("button");
    fb.className = "float-btn" + (i === 0 ? " active" : "");
    fb.innerHTML = `${m.icon} ${m.label}`;
    fb.dataset.cat = cat;
    fb.addEventListener("click", () => { switchTab(cat); window.scrollTo({ top: 0, behavior: "smooth" }); });
    floatEl.appendChild(fb);

    // section
    const sec = document.createElement("div");
    sec.className = "category-section" + (i === 0 ? " active" : "");
    sec.id = `cat-${cat}`;
    sec.innerHTML = `
      <div class="cat-header"><span class="cat-icon">${m.icon}</span><h2 class="cat-title">${m.label}</h2></div>
      <div class="cat-meta">
        <span class="cat-count">${avail} disponibili</span>
        <span class="cat-subtitle">${m.sub}</span>
      </div>
      <div class="menu-grid">
        ${items.map(item => {
          const img = itemImage(item);
          return `
          <div class="menu-card${item.is_available ? "" : " unavailable"}">
            ${img ? `<img class="card-thumb" src="${img}" alt="${item.name}" loading="lazy" onerror="this.remove()">` : ""}
            <div class="card-info">
              <div class="card-name">${item.name}</div>
              ${item.ingredients && item.ingredients.length ? `<div class="card-ingredients">${item.ingredients.join(", ")}</div>` : ""}
              ${item.allergens && item.allergens.length ? `<div class="card-allergens">${item.allergens.map(a => `<span class="allergen-tag">${a}</span>`).join("")}</div>` : ""}
            </div>
            <div class="card-right">
              <span class="card-price">€${parseFloat(item.price).toFixed(2)}</span>
              ${!item.is_available ? '<span class="unavailable-badge">Non disp.</span>' : ""}
            </div>
          </div>`;
        }).join("")}
      </div>`;
    wrap.appendChild(sec);

    // rende ogni card cliccabile → apre la scheda dettaglio
    sec.querySelectorAll(".menu-card").forEach((cardEl, idx) => {
      cardEl.addEventListener("click", () => openDetail(items[idx], cat));
    });
  });

  // float nav visibility — attiva solo dopo paint
  requestAnimationFrame(() => {
    const observer = new IntersectionObserver(([e]) => {
      floatEl.classList.toggle("visible", !e.isIntersecting);
    }, { threshold: 0, rootMargin: "-54px 0px 0px 0px" });
    observer.observe(tabsEl);
  });
}

// ── Scheda dettaglio prodotto ──
function openDetail(item, cat) {
  const modal = document.getElementById("detail-modal");
  const sheet = modal.querySelector(".modal-sheet");
  const img = itemImage(item);
  const m = CAT_META[cat] || {};
  const ingr = item.ingredients && item.ingredients.length ? item.ingredients.join(", ") : "";
  const allergens = item.allergens || [];
  const desc = item.description || item.desc || "";

  sheet.innerHTML = `
    <button class="modal-close" aria-label="Chiudi">✕</button>
    ${img ? `<div class="modal-img-wrap"><img src="${img}" alt="${item.name}" onerror="this.closest('.modal-img-wrap').remove()"></div>` : ""}
    <div class="modal-body${img ? "" : " no-img"}">
      <div class="modal-head">
        <h3 class="modal-name">${item.name}</h3>
        <span class="modal-price">€${parseFloat(item.price).toFixed(2)}</span>
      </div>
      <div>
        ${m.label ? `<span class="modal-cat">${m.icon || ""} ${m.label}</span>` : ""}
        ${!item.is_available ? `<span class="modal-unavail">Non disponibile</span>` : ""}
      </div>
      ${desc ? `<div class="modal-section"><div class="modal-label">Descrizione</div><p class="modal-text">${desc}</p></div>` : ""}
      ${ingr ? `<div class="modal-section"><div class="modal-label">Ingredienti</div><p class="modal-text">${ingr}</p></div>` : ""}
      ${allergens.length ? `<div class="modal-section"><div class="modal-label">Allergeni</div><div class="card-allergens">${allergens.map(a => `<span class="allergen-tag">${a}</span>`).join("")}</div></div>` : ""}
    </div>`;

  sheet.querySelector(".modal-close").addEventListener("click", closeDetail);
  sheet.scrollTop = 0;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeDetail() {
  document.getElementById("detail-modal").classList.remove("open");
  document.body.style.overflow = "";
}

// chiusura: click sullo sfondo o tasto Esc
document.getElementById("detail-modal").addEventListener("click", e => {
  if (e.target.id === "detail-modal") closeDetail();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDetail();
});

function switchTab(cat) {
  document.querySelectorAll(".tab-btn,.float-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
  document.querySelectorAll(".category-section").forEach(s => s.classList.toggle("active", s.id === `cat-${cat}`));
}

loadMenu();
</script>
</body>
</html>
